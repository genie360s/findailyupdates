<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error — Fulusi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { DEFAULT: '#4f46e5', dark: '#3730a3' } } } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4">

<div class="text-center max-w-md">
  <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
    <svg class="w-10 h-10 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.73 2.5z"/>
    </svg>
  </div>

  <h1 class="text-2xl font-bold text-slate-800 mb-2">Something went wrong</h1>
  <p class="text-slate-500 mb-2">We couldn't complete your request.</p>
  {% if message %}
  <div class="bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-sm text-red-700 text-left mb-6">
    {{ message }}
  </div>
  {% endif %}

  <div class="flex flex-col sm:flex-row gap-3 justify-center">
    <a href="javascript:history.back()"
       class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl border border-slate-200
              text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">
      ← Go Back
    </a>
    <a href="{{ url_for('dashboard.overview') }}"
       class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-brand text-white
              text-sm font-medium hover:bg-brand-dark transition-colors shadow-sm">
      Dashboard
    </a>
  </div>
</div>

</body>
</html>
