<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Fulusi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: { brand: { DEFAULT: '#4f46e5', dark: '#3730a3' } }
      }}
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950
             flex items-center justify-center px-4 py-12">

<div class="w-full max-w-md">
  <!-- Logo -->
  <div class="text-center mb-8">
    <a href="{{ url_for('index') }}" class="inline-flex items-center gap-2">
      <div class="w-10 h-10 rounded-xl bg-brand flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
        </svg>
      </div>
      <span class="text-xl font-bold text-white">Fulusi</span>
    </a>
    <h1 class="mt-6 text-2xl font-bold text-white">Create your account</h1>
    <p class="text-slate-400 text-sm mt-1">Free access to Tanzania's financial data</p>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-2xl p-8">

    <!-- Flash error -->
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="mb-5 p-3.5 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      {{ messages[0] }}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST" class="space-y-4">
      <div>
        <label for="fullname" class="block text-sm font-medium text-slate-700 mb-1.5">Full name</label>
        <input id="fullname" name="fullname" type="text" autocomplete="name" required
               class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm
                      placeholder:text-slate-400 focus:outline-none focus:ring-2
                      focus:ring-brand/40 focus:border-brand transition"
               placeholder="John Mwangi">
      </div>

      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required
               class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm
                      placeholder:text-slate-400 focus:outline-none focus:ring-2
                      focus:ring-brand/40 focus:border-brand transition"
               placeholder="johnmwangi">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm
                      placeholder:text-slate-400 focus:outline-none focus:ring-2
                      focus:ring-brand/40 focus:border-brand transition"
               placeholder="you@example.com">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required
               class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm
                      placeholder:text-slate-400 focus:outline-none focus:ring-2
                      focus:ring-brand/40 focus:border-brand transition"
               placeholder="Min. 8 characters">
      </div>

      <div class="flex items-start gap-3 pt-1">
        <input id="terms_and_conditions" name="terms_and_conditions" type="checkbox"
               value="True" required
               class="mt-0.5 w-4 h-4 rounded border-slate-300 accent-brand cursor-pointer">
        <label for="terms_and_conditions" class="text-sm text-slate-600 cursor-pointer leading-snug">
          I agree to the
          <a href="#" class="font-medium text-brand hover:underline">Terms & Conditions</a>
          and
          <a href="#" class="font-medium text-brand hover:underline">Privacy Policy</a>
        </label>
      </div>

      <button type="submit"
              class="w-full bg-brand text-white font-semibold py-2.5 rounded-xl
                     hover:bg-brand-dark transition-colors shadow-sm text-sm mt-1">
        Create Account
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="font-semibold text-brand hover:underline">Sign in</a>
    </p>
  </div>
</div>

</body>
</html>
